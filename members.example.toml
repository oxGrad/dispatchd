# dispatchd team roster.
#
# Located by default at $XDG_CONFIG_HOME/dispatchd/members.toml (typically
# ~/.config/dispatchd/members.toml). Set DISPATCHD_MEMBERS_PATH to point at
# a specific file instead.
#
# Uncomment and edit the entries below with your team's real Discord user
# IDs, then restart dispatchd to seed the roster - editing this file and
# restarting again later updates existing rows in place (matched by
# discord_user_id), it won't create duplicates.
#
# name is just a display label used in bot output (e.g. /team status lines) -
# it doesn't need to match the person's actual Discord username.
# role must be one of: lead | designer | senior | medior | junior | viewer
# 'lead' unlocks the /team command group (status/report/remind/skip-meeting).
# 'viewer' unlocks the same /team commands but, unlike every other role,
# is never nagged to submit /todo or /progress - for someone who only wants
# visibility into the team's progress (e.g. a manager) without participating
# in standups.
# is_admin (default false) unlocks the /admin command group (bot-operator
# only: self-upgrade, systemd/Discord health). It's independent of role -
# set both role = "lead" and is_admin = true if one person needs both.
# See docs/user-guide.md.

# [[members]]
# discord_user_id = "000000000000000000"
# name = "Bot Operator's Name"
# role = "senior"
# is_admin = true

