[package]
name = "dispatchd"
version = "0.12.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.0"
# tzdb-bundle-always: the system tzdata (/usr/share/zoneinfo) is used when
# present; the bundled copy only covers a host without it.
jiff = { version = "1.0.1", features = ["tzdb-bundle-always"] }
libc = "0.2"
minisign-verify = "0.3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rpassword = "7.5.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rusqlite_migration = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "builder", "rustls_backend"] }
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.4"
xdg = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"
