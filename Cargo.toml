[package]
name = "dispatchd"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
rpassword = "7.5.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rusqlite_migration = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "builder", "rustls_backend"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
xdg = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"
