name: Release

on:
  push:
    tags:
      - "v*"

env:
  BIN_NAME: dispatchd

jobs:
  # Quality gates from the shared oxHive pipeline, mirroring the order in
  # oxHive/pipelines rust-release.yml. The binary build below is kept bespoke
  # (static musl, armv7, SHA256SUMS, curl|sh installer) rather than using
  # rust-build-binaries.yml, which is glibc-only and drops armv7.
  verify-version:
    uses: oxHive/pipelines/.github/workflows/rust-verify-version.yml@v2
    with:
      package-name: dispatchd

  check:
    needs: verify-version
    uses: oxHive/pipelines/.github/workflows/rust-check.yml@v2
    with:
      fail-under-coverage: 30

  audit:
    needs: verify-version
    permissions:
      checks: write
      contents: read
    uses: oxHive/pipelines/.github/workflows/rust-audit.yml@v2

  build-linux:
    needs: [check, audit]
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ env.BIN_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist/*.tar.gz

  build-macos:
    needs: [check, audit]
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --target ${{ env.TARGET }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.BIN_NAME }}-${{ env.TARGET }}.tar.gz \
            -C target/${{ env.TARGET }}/release ${{ env.BIN_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ env.TARGET }}
          path: dist/*.tar.gz

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
