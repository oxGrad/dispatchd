name: Release

on:
  push:
    tags:
      - "v*"

env:
  BIN_NAME: dispatchd

jobs:
  # Quality gates from the shared oxHive pipeline, mirroring the order in
  # oxHive/pipelines rust-release.yml. The binary build below is kept bespoke
  # (static musl, armv7, SHA256SUMS, curl|sh installer) rather than using
  # rust-build-binaries.yml, which is glibc-only and drops armv7.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-verify-version@v2
        with:
          package-name: dispatchd

  check:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-check@v2
        with:
          fail-under-coverage: 30

  audit:
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-audit@v2

  build-linux:
    needs: [check, audit]
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ env.BIN_NAME }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist/*.tar.gz

  build-macos:
    needs: [check, audit]
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --target ${{ env.TARGET }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.BIN_NAME }}-${{ env.TARGET }}.tar.gz \
            -C target/${{ env.TARGET }}/release ${{ env.BIN_NAME }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ env.TARGET }}
          path: dist/*.tar.gz

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for minisign.pub, to check the signature below against the key
      # dispatchd actually embeds.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      # `dispatchd upgrade` refuses a SHA256SUMS that minisign.pub's key
      # didn't sign (src/upgrade.rs), so fail the release rather than ship
      # one nobody can upgrade to. The verify step catches a secret that
      # doesn't match the committed public key.
      - name: Sign checksums
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "the MINISIGN_SECRET_KEY secret is not set" >&2; exit 1; }
          cargo install rsign2 --locked
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          rsign sign -W -s "$RUNNER_TEMP/minisign.key" -p ../minisign.pub -x SHA256SUMS.minisig SHA256SUMS
          rm -f "$RUNNER_TEMP/minisign.key"
          rsign verify -p ../minisign.pub -x SHA256SUMS.minisig SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
