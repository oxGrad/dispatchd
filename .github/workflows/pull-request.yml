name: Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-check@v2
        with:
          # dispatchd's serenity/gateway code can't be unit-tested without a
          # live Discord connection (see CLAUDE.md), so the DB-layer core
          # carries the coverage. Local run on 2026-09-01 was 35%; 30 leaves
          # regression room.
          fail-under-coverage: 30

  audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: oxHive/pipelines/.github/actions/rust-audit@v2
