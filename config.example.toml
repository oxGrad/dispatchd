# Example dispatchd config.
#
# By default dispatchd looks for this file at
# $XDG_CONFIG_HOME/dispatchd/config.toml (typically ~/.config/dispatchd/config.toml).
# Set DISPATCHD_CONFIG_PATH to point at a specific file instead (e.g. under
# systemd, where HOME/XDG_CONFIG_HOME may not be set for a service account).
#
# All fields are optional - anything left out keeps its built-in default
# (shown here).

todo_time = "09:00"
update_time = "15:00"
meeting_reminder_time = "16:00"
todo_followup_delay_minutes = 30
ticker_interval_seconds = 60
timezone = "UTC"
